services:
  - type: web
    name: student-performance-prediction
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python train_model.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
